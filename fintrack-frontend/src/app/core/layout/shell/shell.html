<c-sidebar class="border-end" colorScheme="dark" narrowBreakpoint="lg" position="fixed" visible>
  <c-sidebar-brand class="d-none d-md-flex" routerLink="/dashboard">
    <span class="fw-bold fs-4 text-white">💰 FinTrack</span>
  </c-sidebar-brand>

  <c-sidebar-nav [navItems]="navItems"></c-sidebar-nav>
</c-sidebar>

<div class="wrapper d-flex flex-column min-vh-100">
  <c-header class="border-bottom mb-4" position="sticky">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4">
      <div>
        <h5 class="mb-0">{{ pageTitle() }}</h5>
        <nav style="font-size: 0.85rem;" class="text-medium-emphasis">
          <a routerLink="/dashboard" class="text-decoration-none">Home</a> / {{ pageTitle() }}
        </nav>
      </div>
      <div class="d-flex align-items-center gap-3">
        @if (authService.currentUser(); as user) {
          <span class="d-flex align-items-center gap-2">
            <span class="avatar-circle">{{ user.fullName.charAt(0) }}</span>
            {{ user.fullName }}
          </span>
        }
        <button cButton color="danger" variant="outline" size="sm" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </c-header>

  <div class="body flex-grow-1 px-4">
    <router-outlet></router-outlet>
  </div>
</div>
