<c-sidebar class="border-end" narrowBreakpoint="lg" position="fixed" visible>
  <c-sidebar-brand class="d-none d-md-flex" routerLink="/dashboard">
    <span class="fw-bold fs-4 text-white">FinTrack</span>
  </c-sidebar-brand>

  <c-sidebar-nav [navItems]="navItems"></c-sidebar-nav>
</c-sidebar>

<div class="wrapper d-flex flex-column min-vh-100">
  <c-header class="border-bottom mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="fw-semibold fs-5">FinTrack — Personal Finance Manager</span>
      <button cButton color="danger" variant="outline" size="sm" (click)="logout()">
        Logout
      </button>
    </div>
  </c-header>

  <div class="body flex-grow-1 px-4">
    <router-outlet></router-outlet>
  </div>
</div>
