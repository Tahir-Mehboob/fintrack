<div class="auth-container">
  <h2>Login to FinTrack</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="mb-3">
      <label cLabel for="email">Email</label>
      <input
        cFormControl
        type="email"
        id="email"
        name="email"
        [(ngModel)]="formData.email"
        placeholder="Enter your email"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="password">Password</label>
      <input
        cFormControl
        type="password"
        id="password"
        name="password"
        [(ngModel)]="formData.password"
        placeholder="Enter your password"
        required>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button cButton color="primary" type="submit" [disabled]="!loginForm.valid || loading()">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <p class="mt-3">Don't have an account? <a routerLink="/register">Register here</a></p>
</div>
