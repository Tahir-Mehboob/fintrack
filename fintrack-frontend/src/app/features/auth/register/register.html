<div class="auth-container">
  <h2>Create Account</h2>

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="mb-3">
      <label cLabel for="fullName">Full Name</label>
      <input
        cFormControl
        type="text"
        id="fullName"
        name="fullName"
        [(ngModel)]="formData.fullName"
        placeholder="Enter your full name"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="email">Email</label>
      <input
        cFormControl
        type="email"
        id="email"
        name="email"
        [(ngModel)]="formData.email"
        placeholder="Enter your email"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="password">Password</label>
      <input
        cFormControl
        type="password"
        id="password"
        name="password"
        [(ngModel)]="formData.password"
        placeholder="Enter your password"
        minlength="6"
        required>
    </div>

    @if (successMessage()) {
      <div class="alert alert-success">{{ successMessage() }}</div>
    }
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button cButton color="primary" type="submit" [disabled]="!registerForm.valid || loading()">
      {{ loading() ? 'Registering...' : 'Register' }}
    </button>
  </form>

  <p class="mt-3">Already have an account? <a routerLink="/login">Login here</a></p>
</div>
