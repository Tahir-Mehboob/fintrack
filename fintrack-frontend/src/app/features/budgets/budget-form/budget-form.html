<div class="budget-form-container">
  <h3>{{ editingBudget() ? 'Edit Budget' : 'Set Monthly Budget' }}</h3>

  <form (ngSubmit)="onSubmit()" #budgetForm="ngForm">
    <div class="mb-3">
      <label cLabel for="category">Category</label>
      <select cSelect id="category" name="category" [(ngModel)]="selectedCategoryId" required>
        <option [ngValue]="null">Select category</option>
        @for (cat of categories(); track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label cLabel for="monthlyLimit">Monthly Limit</label>
      <input
        cFormControl
        type="number"
        id="monthlyLimit"
        name="monthlyLimit"
        [(ngModel)]="monthlyLimit"
        min="1"
        step="0.01"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="month">Month</label>
      <select cSelect id="month" name="month" [(ngModel)]="selectedMonth">
        @for (m of months; track m.value) {
          <option [ngValue]="m.value">{{ m.text }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label cLabel for="year">Year</label>
      <input
        cFormControl
        type="number"
        id="year"
        name="year"
        [(ngModel)]="selectedYear"
        min="2020"
        max="2100">
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button cButton color="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Saving...' : (editingBudget() ? 'Update Budget' : 'Set Budget') }}
    </button>

    @if (editingBudget()) {
      <button cButton color="secondary" variant="outline" type="button" (click)="onCancel()" style="margin-left: 8px;">
        Cancel
      </button>
    }
  </form>
</div>
