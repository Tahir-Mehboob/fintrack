<div class="category-form-container">
  <h3>Add Category</h3>

  <form (ngSubmit)="onSubmit()" #categoryForm="ngForm">
    <div class="mb-3">
      <label cLabel for="name">Category Name</label>
      <input
        cFormControl
        type="text"
        id="name"
        name="name"
        [(ngModel)]="name"
        placeholder="e.g. Groceries, Rent, Salary"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="type">Type</label>
      <select cSelect id="type" name="type" [(ngModel)]="type">
        <option value="EXPENSE">EXPENSE</option>
        <option value="INCOME">INCOME</option>
      </select>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button cButton color="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Adding...' : 'Add Category' }}
    </button>
  </form>
</div>
