<div class="category-page-container">
  <h1>Manage Categories</h1>

  <app-category-form
    [editingCategory]="editingCategory()"
    (categoryCreated)="onFormSuccess()"
    (cancelEdit)="cancelEdit()">
  </app-category-form>

  <h2>All Categories</h2>

  @if (loading()) {
    <p>Loading...</p>
  } @else if (categories().length === 0) {
    <p>No categories yet. Add one above.</p>
  } @else {
    <kendo-grid [data]="categories()" [pageable]="true" [pageSize]="10">
      <kendo-grid-column field="name" title="Name"></kendo-grid-column>
      <kendo-grid-column field="type" title="Type" [width]="120"></kendo-grid-column>
      <kendo-grid-column title="Actions" [width]="180">
        <ng-template kendoGridCellTemplate let-dataItem>
          <button cButton color="primary" variant="outline" size="sm" (click)="editCategory(dataItem)" style="margin-right: 8px;">
            Edit
          </button>
          <button cButton color="danger" variant="outline" size="sm" (click)="deleteCategory(dataItem.id)">
            Delete
          </button>
        </ng-template>
      </kendo-grid-column>
    </kendo-grid>
  }
</div>
