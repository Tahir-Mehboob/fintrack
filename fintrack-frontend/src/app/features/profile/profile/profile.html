<div class="profile-container">
  <h1>My Profile</h1>

  <div class="profile-section">
    <h3>Account Details</h3>
    <form (ngSubmit)="onUpdateProfile()" #profileForm="ngForm">
      <div class="mb-3">
        <label cLabel for="fullName">Full Name</label>
        <input cFormControl type="text" id="fullName" name="fullName"
               [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" required>
      </div>

      <div class="mb-3">
        <label cLabel for="email">Email</label>
        <input cFormControl type="email" id="email" name="email"
               [ngModel]="email()" (ngModelChange)="email.set($event)" required>
      </div>

      @if (profileMessage()) {
        <div class="alert alert-success">{{ profileMessage() }}</div>
      }
      @if (profileError()) {
        <div class="alert alert-danger">{{ profileError() }}</div>
      }

      <button cButton color="primary" type="submit" [disabled]="profileLoading()">
        {{ profileLoading() ? 'Saving...' : 'Update Profile' }}
      </button>
    </form>
  </div>

  <div class="profile-section">
    <h3>Change Password</h3>
    <form (ngSubmit)="onChangePassword()" #passwordForm="ngForm">
      <div class="mb-3">
        <label cLabel for="currentPassword">Current Password</label>
        <input cFormControl type="password" id="currentPassword" name="currentPassword"
               [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" required>
      </div>

      <div class="mb-3">
        <label cLabel for="newPassword">New Password</label>
        <input cFormControl type="password" id="newPassword" name="newPassword"
               [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" minlength="6" required>
      </div>

      @if (passwordMessage()) {
        <div class="alert alert-success">{{ passwordMessage() }}</div>
      }
      @if (passwordError()) {
        <div class="alert alert-danger">{{ passwordError() }}</div>
      }

      <button cButton color="primary" type="submit" [disabled]="passwordLoading()">
        {{ passwordLoading() ? 'Updating...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
