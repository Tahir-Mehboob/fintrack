<div class="transaction-form-container">
  <h3>Add Transaction</h3>

  <form (ngSubmit)="onSubmit()" #txnForm="ngForm">
    <div class="mb-3">
      <label cLabel for="category">Category</label>
      <select cSelect id="category" name="category" [(ngModel)]="selectedCategoryId" required>
        <option [ngValue]="null">Select category</option>
        @for (cat of categories(); track cat.id) {
          <option [ngValue]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label cLabel for="type">Type</label>
      <select cSelect id="type" name="type" [(ngModel)]="type">
        <option value="EXPENSE">EXPENSE</option>
        <option value="INCOME">INCOME</option>
      </select>
    </div>

    <div class="mb-3">
      <label cLabel for="amount">Amount</label>
      <input
        cFormControl
        type="number"
        id="amount"
        name="amount"
        [(ngModel)]="amount"
        min="0.01"
        step="0.01"
        required>
    </div>

    <div class="mb-3">
      <label cLabel for="description">Description</label>
      <input
        cFormControl
        type="text"
        id="description"
        name="description"
        [(ngModel)]="description"
        placeholder="Optional description">
    </div>

    <div class="mb-3">
      <label cLabel for="transactionDate">Date</label>
      <input
        cFormControl
        type="date"
        id="transactionDate"
        name="transactionDate"
        [(ngModel)]="transactionDate"
        required>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <button cButton color="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Adding...' : 'Add Transaction' }}
    </button>
  </form>
</div>
